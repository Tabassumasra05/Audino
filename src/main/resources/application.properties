# Audino Clinical Decision Support & EMR System
# Core System Properties

app.name=Audino: Intelligent Clinical Decision Support & EMR System
app.version=1.0.0
app.env=production

# Database Configuration
db.url=jdbc:postgresql://localhost:5432/audino
db.user=postgres
db.password=postgres
db.pool.size=10
db.pool.min.idle=2
db.connection.timeout.ms=3000

# Zero-Setup Embedded PostgreSQL Fallback
db.embedded.fallback=true
db.embedded.data.dir=./data/pg-data
db.embedded.port=5432

# Clinical Decision Support Engine Settings
cdss.strict.override=true
cdss.min.justification.chars=15
cdss.queue.poll.interval.sec=3

# Security
security.bcrypt.cost=12
security.kiosk.max.attempts=3
security.kiosk.lockout.sec=60
security.kiosk.idle.reset.sec=120
